name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path stable-api/Cargo.toml --check
      - name: clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The stable API alone (DESIGN.md §47.5): the default build and its own consumer.
      - name: the stable API
        run: |
          cargo clippy --lib -- -D warnings
          cargo clippy --manifest-path stable-api/Cargo.toml --target-dir target/stable-api --all-targets -- -D warnings
          cargo test --manifest-path stable-api/Cargo.toml --target-dir target/stable-api
      - name: tests
        run: cargo test --all-targets
      - name: doc tests
        run: cargo test --doc
      - name: example
        run: cargo run --example singles_turn

  instructions:
    name: instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      # The benchmark threshold (tools/bench_instructions.py): a workload more than 3% above
      # benches/instructions.json fails, when taken with the baseline's rustc and Valgrind;
      # with another toolchain the run warns instead (the baseline wants updating).
      - name: instruction counts against the baseline
        run: python3 tools/bench_instructions.py --check benches/instructions.json
      - name: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instruction-counts
          path: target/bench-instructions/results.json
          if-no-files-found: warn
