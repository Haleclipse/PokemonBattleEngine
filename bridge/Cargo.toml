[package]
name = "battle-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Local JSON bridge from pokemon-battle-engine to the web battle UI"

[dependencies]
pokemon-battle-engine = { path = "..", features = ["internals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
